#
# Build for iOS on GitHub's macOS runners, see docs/ios/PORTING.md.
# Builds the dependencies and an unsigned app bundle for arm64 devices, and the same for the simulator,
# where the app is started as a smoke test. For a release tag, the unsigned app is added to the release.
name: iOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Add the unsigned app to this existing release (tag name), e.g. for a release made before this workflow did so'
        required: false
        default: ''
  push:
    # path filters don't apply to tags, so every release tag is built
    tags: ['v*']
    branches: [android-fork, ios-app, ios-sim]
    paths:
      - 'tools/ios/**'
      - 'tools/android/patches/**'
      - '.github/workflows/ios.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'docs/ios/**'

jobs:
  build:
    # Intel runner: the Apple Silicon ones are frequently not available due to capacity constraints,
    # and Xcode cross-compiles for iOS devices from either; the simulator slices of Qt for iOS are x86_64
    runs-on: macos-15-intel
    timeout-minutes: 360
    permissions:
      contents: write # adding the app to a release
    strategy:
      fail-fast: false
      matrix:
        platform: [device, simulator]
    env:
      IOS_PLATFORM: ${{ matrix.platform }}
      # The installed dependencies contain absolute paths, so they are built outside of the checkout,
      # whose path changes with the name of the repository. v2: since they moved there.
      IOS_PREFIX: /Users/runner/ios-prefix
      DEPS_CACHE: ${{ matrix.platform == 'device' && 'ios-deps-v2' || 'ios-simulator-deps-v2' }}
      ARTIFACT: ${{ matrix.platform == 'device' && 'trinity-ios-unsigned' || 'trinity-ios-simulator' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: brew install ninja gettext gperf bison flex shared-mime-info

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: mac
          target: ios
          arch: ios
          autodesktop: true
          modules: 'qtpositioning qtlocation qtmultimedia qtshadertools qtimageformats qtwebsockets'
          cache: true

      # keep partial progress between runs, so a failure doesn't mean starting over
      - name: Restore dependency build
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.IOS_PREFIX }}
          key: ${{ env.DEPS_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.DEPS_CACHE }}-

      - name: Build dependencies
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix gettext)/bin:$PATH"
          # flex rejects the UTF-8 characters in KOpeningHours' scanner unless it reads its input byte-wise
          export LC_ALL=C
          tools/ios/build-deps.sh "$QT_ROOT_DIR" "$IOS_PREFIX"

      - name: Save dependency build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.IOS_PREFIX }}
          key: ${{ env.DEPS_CACHE }}-${{ github.run_id }}

      - name: Build app
        run: |
          # msgfmt for the translations
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          tools/ios/build-app.sh "$QT_ROOT_DIR" "$IOS_PREFIX" "$PWD/ios-build"

      - name: Package app bundle
        run: |
          mkdir -p ios-artifacts
          # ditto keeps the bundle structure (symlinks, permissions) intact
          ditto -c -k --keepParent ios-build/bin/*.app "ios-artifacts/$ARTIFACT.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ios-artifacts/${{ env.ARTIFACT }}.zip

      # An .ipa is a zip of the app bundle in a Payload directory. It is unsigned, so it has to be signed before it
      # can be installed, e.g. with the certificate and provisioning profile of the one installing it.
      - name: Add the unsigned app to the release
        if: matrix.platform == 'device' && env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ipa/Payload
          ditto ios-build/bin/*.app ipa/Payload/"$(basename ios-build/bin/*.app)"
          (cd ipa && ditto -c -k --keepParent Payload ../trinity-ios-unsigned.ipa)
          # the release is created right after pushing its tag, long before the app is built
          gh release upload "$RELEASE" trinity-ios-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"

      - name: Start the app in the simulator
        if: matrix.platform == 'simulator'
        # booting a new simulator takes about 6 minutes, but sometimes it hangs
        timeout-minutes: 20
        run: tools/ios/simulator-smoke-test.sh ios-build/bin/*.app ios-smoke-test 30

      - name: Upload simulator screenshot and logs
        if: always() && matrix.platform == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke-test
          path: ios-smoke-test
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ matrix.platform }}
          # the generated QML plugin imports and Info.plist are in hidden .qt directories
          include-hidden-files: true
          path: |
            ${{ env.IOS_PREFIX }}/logs
            ios-build/CMakeCache.txt
            ios-build/src/app/*_plugin_imports*.cpp
            ios-build/src/app/.qt/qml_imports/**
            ios-build/src/app/.qt/info_plist/**
